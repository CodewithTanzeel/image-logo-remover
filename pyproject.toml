[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmlogo"
version = "0.0.1"
description = "Remove watermarks and logos from images using automatic detection and OpenCV inpainting"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.9"
authors = [
    {name = "CodewithanZeeL"}
]
keywords = [
    "watermark removal",
    "logo removal", 
    "image processing",
    "inpainting",
    "opencv",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
rmlogo = "rmlogo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/CodewithanZeeL/image-logo-remover"
Repository = "https://github.com/CodewithanZeeL/image-logo-remover.git"
Issues = "https://github.com/CodewithanZeeL/image-logo-remover/issues"
Changelog = "https://github.com/CodewithanZeeL/image-logo-remover/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["rmlogo", "rmlogo.*"]

[tool.setuptools.package-data]
rmlogo = ["*.pth"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B"]
